<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Creacion de cuenta para el sistema de inventario Sipan">
  <title>Crear cuenta | SIPAN Inventario</title>
  <link rel="icon" type="image/svg+xml" href="img/logo.svg">
  <link rel="stylesheet" href="css/estilos.css">
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>
</head>
<body>

  <main class="acceso">

    <section class="acceso-banda">
      <div class="acceso-marca">
        <img src="img/logo.svg" alt="Logo SIPAN" width="40" height="40">
        <span>Comercializadora Sipan S.A.C.</span>
      </div>

      <div class="acceso-titulo">
        <h1>Una cuenta,<br>todo el<br><em>almacen.</em></h1>
        <p>Solo el personal autorizado puede crear una cuenta. Los datos se validan y no se admiten correos repetidos.</p>
      </div>

      <p class="acceso-pie">Sistema interno v1.0 / Acceso restringido</p>
    </section>

    <section class="acceso-cuerpo">
      <div class="tarjeta-acceso">
        <h2>Crear cuenta</h2>
        <p class="subtitulo">Todos los campos son obligatorios.</p>

        <div id="aviso_registro" class="aviso" hidden></div>

        <form id="form_registro" novalidate>

          <!-- Campo trampa oculto para cazar robots -->
          <div class="campo-trampa" aria-hidden="true">
            <label for="empresa_web">No llenar este campo</label>
            <input type="text" id="empresa_web" name="empresa_web" tabindex="-1" autocomplete="off">
          </div>

          <div class="campo">
            <label class="campo-etiqueta" for="nombre">Nombre completo</label>
            <input class="campo-entrada" type="text" id="nombre" name="nombre"
                   autocomplete="name" maxlength="60" required>
          </div>

          <div class="campo">
            <label class="campo-etiqueta" for="usuario">Nombre de usuario</label>
            <input class="campo-entrada" type="text" id="usuario" name="usuario"
                   autocomplete="username" maxlength="20" required>
            <span id="pista_usuario" class="campo-pista"></span>
          </div>

          <div class="campo">
            <label class="campo-etiqueta" for="correo">Correo electronico</label>
            <input class="campo-entrada" type="email" id="correo" name="correo"
                   autocomplete="email" maxlength="80" required>
            <span id="pista_correo" class="campo-pista"></span>
          </div>

          <div class="campo">
            <label class="campo-etiqueta" for="clave">Clave</label>
            <input class="campo-entrada" type="password" id="clave" name="clave"
                   autocomplete="new-password" maxlength="72" required>
            <div class="fuerza"><div id="fuerza_barra" class="fuerza-relleno"></div></div>
            <span id="fuerza_texto" class="fuerza-texto"></span>
          </div>

          <div class="campo">
            <label class="campo-etiqueta" for="confirmacion">Repetir clave</label>
            <input class="campo-entrada" type="password" id="confirmacion" name="confirmacion"
                   autocomplete="new-password" maxlength="72" required>
          </div>

          <div id="captcha_registro" class="caja-captcha"></div>

          <button class="boton" type="submit">Crear cuenta</button>
        </form>

        <p class="enlace-acceso">
          Ya tiene cuenta? <a href="index.html">Inicie sesion</a>
        </p>
      </div>
    </section>

  </main>

  <script src="js/ui.js"></script>
  <script src="js/api.js"></script>
  <script src="js/validacion.js"></script>
  
  <script src="js/captcha.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
